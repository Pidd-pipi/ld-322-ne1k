openapi: 3.0.3
info:
  title: Greenhouse Environment API
  version: 1.0.0
paths:
  /healthz:
    get:
      responses: {'200': {description: Healthy}}
  /api/v1/greenhouses:
    get: {summary: List greenhouses, responses: {'200': {description: OK}}}
  /api/v1/readings:
    post: {summary: Ingest a sensor reading, responses: {'201': {description: Created}}}
  /api/v1/alerts:
    get: {summary: List alerts, responses: {'200': {description: OK}}}
  /api/v1/schedules:
    post: {summary: Create a daily device schedule (deviceId, hour, minute, action); 409 when an enabled schedule exists at the same device and time, responses: {'201': {description: Created}, '409': {description: Conflict}}}
  /api/v1/schedules/{id}:
    patch: {summary: Enable or disable a schedule, responses: {'200': {description: OK}}}
  /api/v1/devices/{id}/schedules:
    get: {summary: List schedules of a device, responses: {'200': {description: OK}}}
